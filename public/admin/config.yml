backend:
  # El acceso se realiza con la cuenta de GitHub que tiene permiso sobre este repositorio.
  name: github
  repo: melisa1008/mi-portfolo
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: appearance
    label: "Apariencia"
    files:
      - name: site_appearance
        label: "Fuentes de la web"
        file: src/data/appearance.json
        fields:
          - label: "Foto de perfil"
            name: profileImage
            widget: image
            required: false
            hint: "Sube una foto vertical o cuadrada. Se mostrará en la portada."
          - label: "Encuadre de la foto"
            name: profileFocus
            widget: select
            default: center
            options:
              - { label: "Centro", value: center }
              - { label: "Arriba", value: top }
              - { label: "Abajo", value: bottom }
              - { label: "Izquierda", value: left }
              - { label: "Derecha", value: right }
              - { label: "Esquina superior izquierda", value: top-left }
              - { label: "Esquina superior derecha", value: top-right }
              - { label: "Esquina inferior izquierda", value: bottom-left }
              - { label: "Esquina inferior derecha", value: bottom-right }
          - label: "Combinación de fuentes"
            name: fontStyle
            widget: select
            options:
              - { label: "Elegante — Playfair Display + DM Sans", value: elegant }
              - { label: "Moderna — Poppins", value: modern }
              - { label: "Clásica — Cormorant Garamond + Montserrat", value: classic }
              - { label: "Minimalista — Libre Baskerville + Inter", value: minimal }
              - { label: "Suave — Playfair Display + Quicksand", value: soft }
              - { label: "Editorial — DM Serif Display + Manrope", value: editorial }
              - { label: "Creativa — Space Grotesk", value: creative }
              - { label: "Profesional — Merriweather + Roboto", value: professional }
              - { label: "Lujo — Cinzel + Source Sans 3", value: luxury }
  - name: blog_es
    label: "Blog · Español"
    folder: src/content/blog/es
    create: true
    slug: "{{slug}}"
    fields: &blog_fields
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - { label: Fecha, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Portada, name: cover, widget: image, required: false }
      - { label: Borrador, name: draft, widget: boolean, default: false, required: false }
      - { label: Contenido, name: body, widget: markdown }
  - name: blog_en
    label: "Blog · English"
    folder: src/content/blog/en
    create: true
    slug: "{{slug}}"
    fields: *blog_fields
  - name: blog_fr
    label: "Blog · Français"
    folder: src/content/blog/fr
    create: true
    slug: "{{slug}}"
    fields: *blog_fields
  - name: projects_es
    label: "Proyectos · Español"
    folder: src/content/projects/es
    create: true
    slug: "{{slug}}"
    fields: &project_fields
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - { label: Fecha, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Etiquetas, name: tags, widget: list }
      - { label: Destacado, name: featured, widget: boolean, default: false }
      - { label: Enlace externo, name: url, widget: string, required: false }
      - { label: Imagen, name: image, widget: image, required: false }
      - { label: Contenido, name: body, widget: markdown }
  - name: projects_en
    label: "Projects · English"
    folder: src/content/projects/en
    create: true
    slug: "{{slug}}"
    fields: *project_fields
  - name: projects_fr
    label: "Projets · Français"
    folder: src/content/projects/fr
    create: true
    slug: "{{slug}}"
    fields: *project_fields
